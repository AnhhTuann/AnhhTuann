<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7159C">
        <animate attributeName="stop-color" values="#F7159C;#FF5E3A;#F7159C" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF7A00">
        <animate attributeName="stop-color" values="#FF7A00;#F7159C;#FF7A00" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .name {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 900;
      fill: url(#nameGradient);
      text-anchor: middle;
      letter-spacing: 3px;
    }
    .title {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #A0AEC0;
      text-anchor: middle;
      letter-spacing: 12px;
    }
  </style>
  
  <text x="50%" y="70" class="name" filter="url(#glow)">
    NGUYEN DUC ANH TUAN
  </text>
  
  <path d="M 250 95 L 550 95" stroke="url(#nameGradient)" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  
  <text x="50%" y="125" class="title">
    FRONTEND ENGINEER
  </text>
</svg>
